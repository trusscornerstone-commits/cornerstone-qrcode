services:
  django:
    env_file: .env
    build:
      context: .
      dockerfile: docker/django.Dockerfile
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: cornerstone
      DB_PASSWORD: cornerstone
      DATABASE_URL: postgres://cornerstone:cornerstone@db:5432/cornerstone
      DJANGO_DEBUG: "1"
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "0"
    command: ["sh", "./docker/entrypoints/django-entrypoint.sh"]
    networks:
      - backend

  db:   
    image: postgres:15
    environment:
      POSTGRES_USER: cornerstone
      POSTGRES_PASSWORD: cornerstone
      POSTGRES_DB: cornerstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - backend

volumes:
  postgres_data:
  staticfiles:

networks:
  backend:
    driver: bridge
